name: Fetch rainfall test

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Every 3 hours at :13 also corresponds to :13 JST.
    - cron: "13 */3 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch three rainfall stations
        env:
          TEST_LIMIT: "3"
          FALLBACK_STEPS: "6"
        run: python scripts/fetch_rainfall.py

      - name: Commit fetched data
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Collect rainfall test snapshot"
          git push
